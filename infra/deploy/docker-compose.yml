# Two services: `web` (nginx + the React bundle) and `backend` (gateway + the agent runtime(s) it starts).
#
#   docker compose -f infra/deploy/docker-compose.yml --env-file infra/deploy/.env up -d
#
# MariaDB, Redis, S3, MongoDB, Dremio and Meilisearch are NOT part of the deployment: point the variables in
# .env at the real ones. For a self-contained trial run add `--profile local-deps` to also start throwaway
# MariaDB/Redis/MinIO/Mongo (never for production data).

services:
  web:
    image: ${WEB_IMAGE:-fox-harness-web:dev}
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-fox-harness-backend:dev}
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    # bubblewrap (the per-session sandbox) needs SYS_ADMIN to create its namespaces and NET_ADMIN to bring up the
    # loopback of the network namespace that cuts model-run code off the network. Both are bwrap's own: the command
    # it runs keeps no capability (--cap-drop ALL). Without them the gateway refuses to start (FOX_REQUIRE_SANDBOX
    # is on in production).
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      # Settings that depend on how the containers are wired, not on the environment you deploy to.
      GATEWAY_PORT: '4000'
      GATEWAY_DATA_DIR: /data
    volumes:
      # Every conversation, workspace and project lives here. Back it up.
      - backend-data:/data
    # Lets the container reach services published on the Docker HOST (Linux needs this line; Docker Desktop has the name already).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # A turn in flight needs time to flush its log when the container is stopped.
    stop_grace_period: 40s
    restart: unless-stopped
    # Not exposed: only the web container talks to it.
    expose:
      - '4000'

  # ---- throwaway dependencies for a trial run (docker compose --profile local-deps up) ----
  mariadb:
    profiles: [local-deps]
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-fox_root_dev}
      MARIADB_DATABASE: discovery-agent
      MARIADB_USER: fox_harness
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:-fox_harness_dev}
    volumes:
      - mariadb-data:/var/lib/mysql
      # Applied once, when the volume is first created.
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
  redis:
    profiles: [local-deps]
    image: redis:7-alpine
    volumes:
      - redis-data:/data
  minio:
    profiles: [local-deps]
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${LOCAL_S3_KEY:-fox_harness}
      MINIO_ROOT_PASSWORD: ${LOCAL_S3_SECRET:-fox_harness_dev}
    volumes:
      - minio-data:/data
  mongo:
    profiles: [local-deps]
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  backend-data:
  mariadb-data:
  redis-data:
  minio-data:
  mongo-data:
