# Local dev only — not a real deployment target (infra/deploy/README.md: not
# decided yet). No redis-server/redis-cli/mariadb installed on this machine,
# and Docker is already required for infra/docker/worker anyway.
#
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#   docker exec -i docker-mariadb-1 mariadb -u fox_harness -pfox_harness_dev fox_harness < infra/migrations/001_init.sql
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    # Named volume (added 2026-09-11 — this file previously had no volumes
    # at all, so redis/mariadb data lived only in each container's own
    # writable layer: `docker compose down` (no `-v` needed) silently
    # destroyed it, `up -d` was the only safe way to bring them back. A
    # named volume survives `down`; only an explicit `down -v` (or `docker
    # volume rm`) removes it now — see the root README's "Running locally"
    # section for the real update-without-losing-data sequence.
    volumes:
      - fox-harness-redis-data:/data
  mariadb:
    # 10.11 — matches prod's real MariaDB version (docs/code-rules.md's
    # MariaDB-migration section: dev/prod parity matters here since several
    # schema features used — CHECK constraints, DESC indexes, CREATE INDEX
    # IF NOT EXISTS — are version-gated). Replaced the dev `postgres` service
    # entirely 2026-09-09 — prod's DB server is MariaDB, not Postgres.
    image: mariadb:10.11
    environment:
      MARIADB_USER: fox_harness
      MARIADB_PASSWORD: fox_harness_dev
      MARIADB_DATABASE: fox_harness
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    ports:
      # 3307, not 3306 — this machine may already run a local MariaDB/MySQL
      # on 3306 (same dodge as the old Postgres 5433-not-5432 default, hit
      # for real back then: binding the standard port silently routes
      # connections to the wrong server).
      - '3307:3306'
    volumes:
      - fox-harness-mariadb-data:/var/lib/mysql
  minio:
    # S3-compatible object storage for local dev (2026-09-14) —
    # `custom_skills.content` (services/gateway/src/object-storage.ts)
    # lives here instead of MariaDB. Prod points `S3_ENDPOINT` at real AWS
    # S3 (or R2/Spaces/other S3-compatible service) instead — same client
    # code either way, only `.env` changes.
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fox_harness
      MINIO_ROOT_PASSWORD: fox_harness_dev
    ports:
      - '9000:9000' # S3 API — this is what S3_ENDPOINT points at
      - '9001:9001' # web console (login with the credentials above)
    volumes:
      - fox-harness-minio-data:/data
  dremio:
    # docs/data-studio-agent-transfer-plan.md — data plane thật cho tool
    # `analyze_data` (packages/tool/data-studio-agent, gọi vào pipeline Python
    # vendor từ example-data-studio-agent qua subprocess, không phải service
    # HTTP riêng). CHỈ dùng cho dev/test: prod trỏ vào Dremio doanh nghiệp đã
    # có sẵn (`DREMIO_URL` trong `.env`, không tự host).
    # Web UI + REST API cùng cổng 9047 (login lần đầu qua UI để tạo tài
    # khoản admin trước khi pipeline gọi được).
    image: dremio/dremio-oss
    ports:
      - '9047:9047' # Web UI + REST API — DREMIO_URL trỏ vào đây
      - '31010:31010' # JDBC/ODBC (không dùng tới trong flow này, mở sẵn phòng khi cần)
    volumes:
      - fox-harness-dremio-data:/opt/dremio/data
  meilisearch:
    # docs/data-studio-agent-transfer-plan.md — retrieval hybrid cho
    # semantic layer của `packages/tool/data-studio-agent/python`. Không có
    # MEILI_MASTER_KEY ở dev (`.env`'s MEILISEARCH_MASTER_KEY để trống) —
    # image tự chạy chế độ không khoá kèm cảnh báo, chấp nhận được cho dev.
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - fox-harness-meilisearch-data:/meili_data

volumes:
  fox-harness-redis-data:
  fox-harness-mariadb-data:
  fox-harness-minio-data:
  fox-harness-dremio-data:
  fox-harness-meilisearch-data:
